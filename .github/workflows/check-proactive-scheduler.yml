name: Check proactive scheduler
on:
  push:
    branches: [codex/cloudflare-deploy-20261016]
    paths: [.github/workflows/check-proactive-scheduler.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read public scheduler heartbeat
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url='https://shengjian-memory.yilis2716.workers.dev/proactive-health';
          const response=await fetch(url,{signal:AbortSignal.timeout(20000)});
          if(!response.ok)throw Error('Health HTTP '+response.status);
          const body=await response.json();
          console.log(JSON.stringify({checked_at:new Date().toISOString(),ok:body.ok,scheduler:body.scheduler}));
          JS
